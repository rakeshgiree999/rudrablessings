<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ff4d7d"><title>Do you love me? ❤️</title>
<style>
*{box-sizing:border-box}html,body{height:100%}body{margin:0;overflow:hidden;font-family:Inter,ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;color:#402033;background:radial-gradient(circle at 15% 20%,rgba(255,255,255,.95) 0 7%,transparent 24%),radial-gradient(circle at 85% 15%,rgba(255,221,232,.9) 0 8%,transparent 26%),radial-gradient(circle at 50% 115%,rgba(255,83,132,.18) 0 24%,transparent 50%),linear-gradient(135deg,#fff6fa,#ffe3ed 45%,#ffd1e0)}
.glow{position:fixed;inset:-20%;pointer-events:none;background:conic-gradient(from 180deg,transparent,rgba(255,255,255,.35),transparent 35%);animation:turn 18s linear infinite;filter:blur(60px)}@keyframes turn{to{transform:rotate(360deg)}}
.hearts{position:fixed;inset:0;pointer-events:none;overflow:hidden}.heart{position:absolute;bottom:-48px;opacity:.28;animation:floatUp linear infinite;user-select:none}@keyframes floatUp{0%{transform:translateY(0) rotate(0) scale(.8);opacity:0}12%{opacity:.26}75%{opacity:.2}100%{transform:translateY(-120vh) rotate(24deg) scale(1.18);opacity:0}}
main{min-height:100%;display:grid;place-items:center;padding:24px;position:relative;z-index:2}.card{width:min(92vw,560px);min-height:430px;padding:46px 34px 38px;border-radius:34px;background:rgba(255,255,255,.74);border:1px solid rgba(255,255,255,.82);box-shadow:0 28px 70px rgba(122,31,72,.18),inset 0 1px 0 rgba(255,255,255,.9);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);text-align:center;position:relative;overflow:visible}
.mini{display:inline-flex;align-items:center;gap:8px;padding:8px 13px;border-radius:999px;background:rgba(255,77,125,.09);color:#b03a65;font-weight:700;font-size:13px;margin-bottom:22px}.pulse{width:8px;height:8px;border-radius:50%;background:#ff4d7d;box-shadow:0 0 0 0 rgba(255,77,125,.35);animation:pulse 1.7s infinite}@keyframes pulse{70%{box-shadow:0 0 0 9px rgba(255,77,125,0)}}
.big-heart{width:92px;height:92px;display:grid;place-items:center;margin:0 auto 18px;border-radius:28px;background:linear-gradient(145deg,#ff5f8c,#ff3b72);color:#fff;font-size:49px;transform:rotate(-4deg);box-shadow:0 18px 42px rgba(255,61,116,.31);animation:beat 1.5s ease-in-out infinite}@keyframes beat{0%,100%{transform:rotate(-4deg) scale(1)}45%{transform:rotate(-4deg) scale(1.055)}}
h1{margin:0;font-size:clamp(38px,8vw,64px);line-height:.98;letter-spacing:-.055em;color:#56233b}.love{display:inline-block;background:linear-gradient(90deg,#ff477e,#f52a67,#ff7e9f);-webkit-background-clip:text;background-clip:text;color:transparent}.sub{width:min(92%,410px);margin:18px auto 0;color:#80536a;font-size:16px;line-height:1.55}.arena{position:relative;width:100%;height:118px;margin-top:28px}button{border:0;font:inherit;font-weight:800;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none;touch-action:manipulation}
#yesBtn{position:absolute;left:50%;top:14px;transform:translateX(-118%);min-width:142px;height:56px;border-radius:18px;color:#fff;background:linear-gradient(135deg,#ff477e,#ff2f68);box-shadow:0 12px 28px rgba(255,47,104,.28);transition:.2s;z-index:5}#yesBtn:hover{transform:translateX(-118%) translateY(-2px) scale(1.03)}#noBtn{position:absolute;left:calc(50% + 18px);top:14px;min-width:118px;height:56px;border-radius:18px;color:#9b5571;background:rgba(255,255,255,.8);border:1px solid rgba(146,70,100,.13);box-shadow:0 8px 22px rgba(99,46,70,.11);transition:left .16s ease,top .16s ease;z-index:6}.hint{margin-top:-4px;font-size:12px;color:#a4788c;min-height:20px}
.result{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at center,rgba(255,255,255,.96),rgba(255,224,235,.98));opacity:0;visibility:hidden;transition:.35s}.result.show{opacity:1;visibility:visible}.result-inner{text-align:center;animation:pop .55s cubic-bezier(.18,.9,.22,1.2) both}@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}.result-heart{font-size:92px}.result h2{margin:10px 0 8px;font-size:clamp(42px,10vw,72px);letter-spacing:-.05em;color:#61233f}.result p{margin:0;color:#90546d;font-size:18px}.burst{position:fixed;width:18px;height:18px;pointer-events:none;z-index:70;animation:burst 1.2s ease-out forwards}@keyframes burst{to{transform:translate(var(--x),var(--y)) rotate(360deg) scale(.3);opacity:0}}
@media(max-width:520px){.card{padding:38px 20px 30px;min-height:430px;border-radius:28px}.big-heart{width:78px;height:78px;font-size:41px;border-radius:24px}.arena{height:160px}#yesBtn{left:50%;transform:translateX(-50%);top:12px;min-width:166px}#yesBtn:hover{transform:translateX(-50%) translateY(-2px) scale(1.03)}#noBtn{left:50%;transform:translateX(-50%);top:82px;min-width:132px}}
</style>
</head>
<body><div class="glow"></div><div class="hearts" id="hearts"></div><main><section class="card"><div class="mini"><span class="pulse"></span> one very important question</div><div class="big-heart">♥</div><h1>I love you.<br><span class="love">Do you love me?</span></h1><p class="sub">There is only one correct answer here… and I think you already know it. 💗</p><div class="arena" id="arena"><button id="yesBtn">Yes, I do ❤️</button><button id="noBtn">No 🙈</button></div><div class="hint" id="hint">Choose carefully 😌</div></section></main><section class="result" id="result"><div class="result-inner"><div class="result-heart">💖</div><h2>I knew it!</h2><p>You just made my heart very happy. 🥹❤️</p></div></section>
<script>
const noBtn=document.getElementById('noBtn'),yesBtn=document.getElementById('yesBtn'),arena=document.getElementById('arena'),hint=document.getElementById('hint'),result=document.getElementById('result');const teases=['Nice try 😏','Nope… try again 😂','That button is shy 🙈','Are you suuuure? 👀','The universe says YES 💘','Almost got it 😜'];let ti=0;for(let i=0;i<22;i++){let h=document.createElement('span');h.className='heart';h.textContent=['♥','♡','❤','💕'][Math.floor(Math.random()*4)];h.style.left=Math.random()*100+'vw';h.style.fontSize=14+Math.random()*26+'px';h.style.animationDuration=8+Math.random()*10+'s';h.style.animationDelay=-Math.random()*14+'s';document.getElementById('hearts').appendChild(h)}
function dodge(){let a=arena.getBoundingClientRect(),b=noBtn.getBoundingClientRect(),y=yesBtn.getBoundingClientRect(),p=4,mx=Math.max(p,a.width-b.width-p),my=Math.max(p,a.height-b.height-p),x=p+Math.random()*Math.max(1,mx-p),t=p+Math.random()*Math.max(1,my-p);for(let n=0;n<14;n++){let c={left:a.left+x,right:a.left+x+b.width,top:a.top+t,bottom:a.top+t+b.height},g=14,o=c.left<y.right+g&&c.right>y.left-g&&c.top<y.bottom+g&&c.bottom>y.top-g;if(!o)break;x=p+Math.random()*Math.max(1,mx-p);t=p+Math.random()*Math.max(1,my-p)}noBtn.style.transform='none';noBtn.style.left=x+'px';noBtn.style.top=t+'px';hint.textContent=teases[ti++%teases.length]}
noBtn.addEventListener('mouseenter',dodge);noBtn.addEventListener('pointerdown',e=>{e.preventDefault();dodge()});noBtn.addEventListener('click',e=>{e.preventDefault();dodge()});document.addEventListener('pointermove',e=>{if(e.pointerType==='touch')return;let r=noBtn.getBoundingClientRect(),dx=Math.max(r.left-e.clientX,0,e.clientX-r.right),dy=Math.max(r.top-e.clientY,0,e.clientY-r.bottom);if(Math.hypot(dx,dy)<28)dodge()});yesBtn.addEventListener('click',()=>{result.classList.add('show');burst()});function burst(){let cx=innerWidth/2,cy=innerHeight/2,ch=['❤','💖','💕','💗','✨'];for(let i=0;i<38;i++){let p=document.createElement('div');p.className='burst';p.textContent=ch[Math.floor(Math.random()*ch.length)];p.style.left=cx+'px';p.style.top=cy+'px';p.style.setProperty('--x',Math.random()*620-310+'px');p.style.setProperty('--y',Math.random()*620-310+'px');p.style.fontSize=14+Math.random()*24+'px';document.body.appendChild(p);setTimeout(()=>p.remove(),1500)}}
</script></body></html>
